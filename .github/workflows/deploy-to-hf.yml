name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history to ensure correct commit references

      - name: Set up Git for authentication
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
          git config --global credential.helper store
          echo "https://user:${{ secrets.HF_TOKEN }}@huggingface.co" > ~/.git-credentials

      - name: Prepare the repository
        run: |
          # Checkout a clean branch to deploy to Hugging Face
          git checkout --orphan hf-clean
          git rm -rf . || true   # Remove all files in this branch

          # Checkout the contents from the main branch and prepare for pushing
          git checkout main -- .
          git add .
          git commit -m "Deploy Candidate service to Hugging Face Space"

      - name: Push to Hugging Face Space
        run: |
          git remote add hf_candidate https://huggingface.co/spaces/LeanonHub/hr-saas-candidate || true
          git push hf_candidate hf-clean:main --force
